<!doctype html>
<html><head><meta charset="utf-8"><title>Baliza de avalancha</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:540px;height:960px}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="timing.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), X = cv.getContext('2d');
const W = 1080, H = 1920, IL_Y = 330, IL_H = 1090; // zona de ilustración
const C = {bg:'#0B0D14', night:'#1E2A4F', night2:'#121A33', wood:'#4A3426', woodD:'#3B2A1F', woodL:'#5A402F',
  yellow:'#E8B931', red:'#E04848', green:'#4CC38A', ice:'#6EC6FF', white:'#F5F5F5', gray:'#8A8F9C', skin:'#F2C29B', skin2:'#E8B08A'};
const F = (w, s) => `${w} ${s}px Inter`, MONO = s => `600 ${s}px "JetBrains Mono", "DejaVu Sans Mono", monospace`;
const T = TIMING, SC = T.scenes, WORDS = T.words;

// ---------- utilidades ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < 0 ? 0 : k > 1 ? 1 : 1 - Math.pow(1 - k, 3);
const easeIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function rr(x, y, w, h, r, fill, stroke, lw) { X.beginPath(); X.roundRect(x, y, w, h, r); if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.lineWidth = lw || 3; X.strokeStyle = stroke; X.stroke(); } }
function circ(x, y, r, fill, stroke, lw) { X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2); if (fill) { X.fillStyle = fill; X.fill(); } if (stroke) { X.lineWidth = lw || 3; X.strokeStyle = stroke; X.stroke(); } }
function ell(x, y, rx, ry, fill) { X.beginPath(); X.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); X.fillStyle = fill; X.fill(); }
function txt(s, x, y, font, color, align = 'center', base = 'middle') { X.font = font; X.fillStyle = color; X.textAlign = align; X.textBaseline = base; X.fillText(s, x, y); }
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function wordTime(sc, w, nth = 0) { let n = 0; for (const o of WORDS) if (o.sc === sc && o.w.toLowerCase().replace(/[^a-záéíóúñü]/g, '') === w) { if (n++ === nth) return o.s - SC[sc].start; } return 0; }

// ---------- personajes ----------
// p: {x, y (pies), h, skin, hair, hairStyle, shirt, pants, shoes, mouth, eyes, look, blink, arms, vest, badge, clip, beard, scale}
function person(p) {
  const h = p.h, u = h / 100; X.save(); X.translate(p.x, p.y); if (p.flip) X.scale(-1, 1);
  const sh = p.shoes || '#222', legW = 9 * u;
  // piernas
  rr(-12 * u, -42 * u, legW, 40 * u, 3 * u, p.pants || '#2E3A5C'); rr(3 * u, -42 * u, legW, 40 * u, 3 * u, p.pants || '#2E3A5C');
  rr(-14 * u, -4 * u, 13 * u, 5 * u, 2 * u, sh); rr(2 * u, -4 * u, 13 * u, 5 * u, 2 * u, sh);
  // torso
  rr(-19 * u, -76 * u, 38 * u, 38 * u, 9 * u, p.shirt || C.yellow);
  if (p.plaid) { X.save(); X.beginPath(); X.roundRect(-19 * u, -76 * u, 38 * u, 38 * u, 9 * u); X.clip(); X.strokeStyle = 'rgba(0,0,0,.25)'; X.lineWidth = 2.2 * u; for (let i = -20; i < 20; i += 7) { X.beginPath(); X.moveTo(i * u, -76 * u); X.lineTo(i * u, -38 * u); X.stroke(); X.beginPath(); X.moveTo(-19 * u, (-74 + i + 20) * u); X.lineTo(19 * u, (-74 + i + 20) * u); X.stroke(); } X.restore(); }
  if (p.vest) { rr(-19 * u, -74 * u, 13 * u, 35 * u, 5 * u, p.vest); rr(6 * u, -74 * u, 13 * u, 35 * u, 5 * u, p.vest); }
  if (p.badge) { rr(-15 * u, -66 * u, 9 * u, 11 * u, 1.5 * u, '#E9E9E9'); rr(-13 * u, -64 * u, 5 * u, 4 * u, 1 * u, '#9AA0AA'); }
  // brazos
  const arm = (side, ang) => { X.save(); X.translate(side * 19 * u, -71 * u); X.rotate(ang); rr(-4.5 * u, 0, 9 * u, 31 * u, 4.5 * u, p.sleeve || p.shirt || C.yellow); circ(0, 32 * u, 4.6 * u, p.skin || C.skin); X.restore(); };
  const a = p.arms || [0.12, -0.12];
  arm(-1, a[0]); arm(1, a[1]);
  if (p.clip) { X.save(); X.translate(14 * u, -50 * u); X.rotate(-0.15); rr(-2 * u, -14 * u, 18 * u, 24 * u, 2 * u, '#C9A46A'); rr(0, -11 * u, 14 * u, 19 * u, 1 * u, '#F4F1E8'); rr(4 * u, -15 * u, 6 * u, 3 * u, 1 * u, '#777'); for (let i = 0; i < 4; i++) rr(2 * u, (-7 + i * 4) * u, 10 * u, 1.2 * u, 0, '#AAA'); X.restore(); }
  if (p.cup) { rr(15 * u, -45 * u, 10 * u, 11 * u, 2 * u, p.cup); }
  // cuello y cabeza
  rr(-5 * u, -82 * u, 10 * u, 8 * u, 2 * u, p.skin2 || C.skin2);
  const hy = -97 * u, hr = 16 * u;
  if (p.hairStyle === 'long') { rr(-19 * u, hy - 4 * u, 38 * u, 34 * u, 12 * u, p.hair); }
  circ(0, hy, hr, p.skin || C.skin);
  if (p.hair && p.hairStyle !== 'bald') {
    X.save(); X.beginPath(); X.arc(0, hy, hr + 1.5 * u, Math.PI * 1.02, Math.PI * 1.98); X.closePath(); X.fillStyle = p.hair; X.fill(); X.restore();
    if (p.hairStyle === 'pigtails') { circ(-18 * u, hy - 2 * u, 6 * u, p.hair); circ(18 * u, hy - 2 * u, 6 * u, p.hair); }
    if (p.hairStyle === 'side') { X.beginPath(); X.moveTo(-hr, hy - 2 * u); X.quadraticCurveTo(-4 * u, hy - 4 * u, 6 * u, hy - 15 * u); X.lineTo(-hr, hy - 12 * u); X.fillStyle = p.hair; X.fill(); }
  }
  if (p.hairStyle === 'bald' && p.hair) { X.save(); X.beginPath(); X.arc(0, hy, hr + 1 * u, Math.PI * .85, Math.PI * 1.15); X.lineWidth = 3 * u; X.strokeStyle = p.hair; X.stroke(); X.beginPath(); X.arc(0, hy, hr + 1 * u, -Math.PI * .15, Math.PI * .15); X.stroke(); X.restore(); }
  if (p.beard) { X.beginPath(); X.arc(0, hy + 4 * u, 13 * u, 0.1 * Math.PI, 0.9 * Math.PI); X.lineTo(-8 * u, hy + 3 * u); X.fillStyle = p.beard; X.fill(); }
  // ojos
  const es = p.eyeScale || 1, lx = (p.look || 0) * 1.8 * u, er = 4.6 * u * es;
  for (const s of [-1, 1]) {
    const ex = s * 6.5 * u, ey = hy - 1 * u;
    if (p.blink) { rr(ex - er, ey - 0.8 * u, er * 2, 1.6 * u, 1 * u, '#222'); continue; }
    circ(ex, ey, er, '#FFF'); circ(ex + lx, ey + (p.lookY || 0) * u, er * (p.pupil || 0.42), '#151515');
  }
  // boca
  X.strokeStyle = '#5A2D22'; X.lineWidth = 1.7 * u; X.lineCap = 'round';
  const my = hy + 8 * u;
  if (p.mouth === 'grin') { X.beginPath(); X.arc(0, my - 4 * u, 8.5 * u, 0.12 * Math.PI, 0.88 * Math.PI); X.fillStyle = '#3A1712'; X.fill(); X.beginPath(); X.rect(-7 * u, my + 0.5 * u, 14 * u, 2.2 * u); X.fillStyle = '#FFF'; X.fill(); }
  else if (p.mouth === 'smile') { X.beginPath(); X.arc(0, my - 3 * u, 5 * u, 0.2 * Math.PI, 0.8 * Math.PI); X.stroke(); }
  else if (p.mouth === 'o') { ell(0, my, 2.6 * u, 3.4 * u, '#3A1712'); }
  else if (p.mouth === 'worried') { X.beginPath(); X.arc(0, my + 3 * u, 4 * u, 1.2 * Math.PI, 1.8 * Math.PI); X.stroke(); }
  else { X.beginPath(); X.moveTo(-3.5 * u, my); X.lineTo(3.5 * u, my); X.stroke(); }
  if (p.blush) { circ(-10 * u, hy + 5 * u, 2.6 * u, 'rgba(230,110,110,.45)'); circ(10 * u, hy + 5 * u, 2.6 * u, 'rgba(230,110,110,.45)'); }
  X.restore();
}
const YOU = {skin: C.skin, hair: '#5B3A22', hairStyle: 'side', shirt: C.yellow, pants: '#2E3A5C', shoes: '#1A1A1A'};
const MOM = {skin: '#E9B88F', hair: '#2A1B14', hairStyle: 'long', shirt: '#7A4FA0', pants: '#3A2F4F'};
const SIS = {skin: C.skin, hair: '#6B3F22', hairStyle: 'pigtails', shirt: '#3B82C4', pants: '#24304F', blush: true};
const MAN = {skin: '#E6D3C3', skin2: '#D6BFAE', hair: '#1C1C1C', hairStyle: 'side', shirt: '#E8E8E8', sleeve: '#E8E8E8', vest: '#6B7280', pants: '#2B2B2B', badge: true, clip: true, mouth: 'grin', eyeScale: 1.05, pupil: .3};
const OLD = {skin: '#E2B791', hair: '#DDD', hairStyle: 'bald', beard: '#E8E8E8', shirt: '#7A5A3A', pants: '#4A3B2E', mouth: 'line'};
const blinkAt = (t, seed) => ((t + seed) % 3.7) < 0.12;

// ---------- fondos ----------
function woodWall(x, y, w, h, base = C.wood, line = C.woodD) {
  X.fillStyle = base; X.fillRect(x, y, w, h); X.strokeStyle = line; X.lineWidth = 4;
  for (let i = x + 30; i < x + w; i += 64) { X.beginPath(); X.moveTo(i, y); X.lineTo(i, y + h); X.stroke(); }
  X.strokeStyle = 'rgba(0,0,0,.12)'; X.lineWidth = 2;
  for (let i = 0; i < 26; i++) { const xx = x + rnd(i) * w, yy = y + rnd(i + 9) * h; X.beginPath(); X.moveTo(xx, yy); X.lineTo(xx, yy + 40 + rnd(i + 3) * 60); X.stroke(); }
}
function floor(y, col = '#2A1E17') { X.fillStyle = col; X.fillRect(0, y, W, IL_H - y); X.fillStyle = 'rgba(0,0,0,.25)'; X.fillRect(0, y, W, 8); }
function nightWindow(x, y, w, h, t, day = false) {
  rr(x - 14, y - 14, w + 28, h + 28, 6, '#2B1E16');
  X.save(); X.beginPath(); X.rect(x, y, w, h); X.clip();
  const g = X.createLinearGradient(0, y, 0, y + h);
  if (day) { g.addColorStop(0, '#BFE3F5'); g.addColorStop(1, '#F7E3B5'); } else { g.addColorStop(0, C.night2); g.addColorStop(1, C.night); }
  X.fillStyle = g; X.fillRect(x, y, w, h);
  if (day) circ(x + w * .7, y + h * .3, 34, '#FFF3C4'); else { circ(x + w * .68, y + h * .28, 26, '#F2F2F2'); for (let i = 0; i < 14; i++) circ(x + rnd(i) * w, y + rnd(i + 4) * h * .5, 2, 'rgba(255,255,255,.7)'); }
  X.fillStyle = day ? '#5E8A6A' : '#0A0F1E';
  for (let i = 0; i < 7; i++) { const px = x + i * w / 6 - 10, ph = 60 + rnd(i + 2) * 50; X.beginPath(); X.moveTo(px - 22, y + h); X.lineTo(px, y + h - ph); X.lineTo(px + 22, y + h); X.fill(); }
  X.restore();
  X.fillStyle = '#2B1E16'; X.fillRect(x + w / 2 - 6, y, 12, h); X.fillRect(x, y + h / 2 - 6, w, 12);
}
function door(x, y, w, h, shake = 0, peep = true) {
  X.save(); X.translate(shake * (Math.sin(performanceT * 90) * 6), 0);
  rr(x - 16, y - 16, w + 32, h + 16, 4, '#2B1E16');
  rr(x, y, w, h, 3, '#6B4A33');
  for (const [a, b] of [[.12, .08], [.12, .55]]) rr(x + w * a, y + h * b, w * .76, h * .36, 4, null, '#5A3D29', 6);
  circ(x + w * .85, y + h * .55, 11, '#C9A46A'); if (peep) circ(x + w / 2, y + h * .27, 7, '#111');
  X.restore();
}
function knockRings(cx, cy, k) { // k 0..1
  for (let i = 0; i < 3; i++) { const kk = clamp(k * 1.4 - i * .2); if (kk <= 0 || kk >= 1) continue; circ(cx, cy, 20 + kk * 140, null, `rgba(232,185,49,${(1 - kk) * .8})`, 5); }
}
function vignette(a = .6) { const g = X.createRadialGradient(W / 2, IL_H / 2, IL_H * .25, W / 2, IL_H / 2, IL_H * .85); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); X.fillStyle = g; X.fillRect(0, 0, W, IL_H); }
function tag(s, x, y, col = C.gray) { X.font = MONO(22); const w = X.measureText(s).width + 26; rr(x, y, w, 40, 4, 'rgba(11,13,20,.75)', col, 2); txt(s, x + w / 2, y + 21, MONO(22), col); }

// ---------- tarjeta de regla ----------
function ruleCard(n, big, small, lt, red) {
  const k = ease(lt / .45), col = red ? C.red : C.yellow;
  X.save(); X.globalAlpha = k; X.translate(0, (1 - k) * 60);
  rr(70, 300, 940, 470, 18, 'rgba(11,13,20,.92)', col, 5);
  txt('REGLA ' + n, 540, 370, MONO(34), col);
  X.fillStyle = col; X.fillRect(470, 400, 140, 4);
  wrap(big, 540, 480, 860, F(900, 66), C.white, 78);
  if (small) wrap(small, 540, 690, 860, F(700, 40), red ? '#F2A0A0' : '#D9C27A', 50);
  X.restore();
}
function wrap(s, x, y, maxW, font, color, lh) {
  X.font = font; const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (X.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  lines.push(cur); const y0 = y - (lines.length - 1) * lh / 2;
  lines.forEach((l, i) => txt(l, x, y0 + i * lh, font, color));
}

// ---------- ESCENAS · VIDEO 3: BALIZA DE AVALANCHA ----------
let performanceT = 0;
const S = [];
const SNOW = '#E8F1F8', SNOW2 = '#C9DAEA', SNOW3 = '#9FB8D1', SKY1 = '#22324F', SKY2 = '#5F7FA6';
const JACKET = {...YOU, shirt: C.yellow, sleeve: C.yellow, pants: '#2E3A5C', hair: '#2E5C8A', hairStyle: 'side'};

function skyMountain(lt, dark = 0) {
  const g = X.createLinearGradient(0, 0, 0, 700); g.addColorStop(0, SKY1); g.addColorStop(1, SKY2); X.fillStyle = g; X.fillRect(0, 0, W, IL_H);
  X.fillStyle = '#7F98B8'; X.beginPath(); X.moveTo(-50, 620); X.lineTo(260, 180); X.lineTo(520, 560); X.lineTo(760, 120); X.lineTo(1130, 640); X.fill();
  X.fillStyle = SNOW; X.beginPath(); X.moveTo(260, 180); X.lineTo(320, 270); X.lineTo(230, 260); X.fill(); X.beginPath(); X.moveTo(760, 120); X.lineTo(840, 230); X.lineTo(700, 210); X.fill();
  X.fillStyle = SNOW2; X.beginPath(); X.moveTo(-50, 1200); X.lineTo(-50, 640); X.quadraticCurveTo(540, 520, 1130, 660); X.lineTo(1130, 1200); X.fill();
  for (let i = 0; i < 60; i++) { const x = (rnd(i) * W + lt * 30 * (1 + rnd(i + 3))) % W, y = (rnd(i + 9) * IL_H + lt * 80 * (1 + rnd(i + 5))) % IL_H; circ(x, y, 2 + rnd(i) * 3, 'rgba(255,255,255,.7)'); }
  if (dark) { X.fillStyle = `rgba(5,10,25,${dark})`; X.fillRect(0, 0, W, IL_H); }
}
function beacon(x, y, s, dist, o = {}) {
  X.save(); X.translate(x, y); X.scale(s, s); X.rotate(o.rot || 0);
  rr(-130, -220, 260, 440, 40, '#F07A1A'); rr(-105, -190, 210, 250, 16, '#0E1A12');
  // flecha
  if (dist !== null) { X.save(); X.translate(0, -110); X.rotate(o.arrow || 0); X.fillStyle = '#8CFF9E'; X.beginPath(); X.moveTo(0, -50); X.lineTo(34, 0); X.lineTo(12, 0); X.lineTo(12, 40); X.lineTo(-12, 40); X.lineTo(-12, 0); X.lineTo(-34, 0); X.fill(); X.restore();
    txt(dist + ' m', 0, 0, F(900, 56), '#8CFF9E'); }
  txt(o.mode || 'EMITIR', 0, 44, MONO(o.modeSize || 20), o.modeCol || 'rgba(140,255,158,.55)');
  circ(0, 130, 46, '#C55F10'); circ(0, 130, 30, '#2A2A2A');
  if (o.beep) { for (let i = 0; i < 2; i++) { const k = (o.beep + i * .5) % 1; circ(0, -110, 140 + k * 140, null, `rgba(140,255,158,${(1 - k) * .5})`, 5); } }
  X.restore();
}
function underSnow(lt, o = {}) {
  X.fillStyle = '#8FB0CF'; X.fillRect(0, 0, W, IL_H);
  // capas de nieve compacta
  for (let i = 0; i < 9; i++) { X.fillStyle = i % 2 ? '#A9C3DC' : '#9AB8D5'; X.beginPath(); X.moveTo(0, 220 + i * 110); for (let x = 0; x <= W; x += 60) X.lineTo(x, 220 + i * 110 + Math.sin(x * .01 + i) * 14); X.lineTo(W, IL_H); X.lineTo(0, IL_H); X.fill(); }
  X.fillStyle = SKY2; X.fillRect(0, 0, W, 120); X.fillStyle = SNOW; X.fillRect(0, 110, W, 30);
  if (o.figures) { person({...JACKET, shirt: '#C94444', sleeve: '#C94444', x: 380, y: 120, h: 90}); person({...JACKET, shirt: '#3B82C4', sleeve: '#3B82C4', x: 700, y: 120, h: 90}); }
}
function hudBeacon(i, lt, d) {
  const sim = [0, 30, 45, 60, 120, 150, 300, 330, 480, 500, 540, 720, 760, 780], k = clamp(lt / d);
  const s = i < 13 ? lerp(sim[i], sim[i + 1], k) : 780, left = Math.max(0, 900 - 30 - s);
  if (i >= 1 && i <= 11) { const mm = Math.floor(left / 60), ss = Math.floor(left % 60), red = left < 300;
    rr(W - 300, 20, 270, 74, 10, 'rgba(11,13,20,.85)', red ? C.red : C.ice, 3); txt(`${mm}:${String(ss).padStart(2, '0')}`, W - 165, 58, F(900, 44), red ? C.red : C.ice); }
  const dist = [null, null, 14, 12, 9, 5, 2, 2, 2, 2, null, null, null, null][i];
  if (dist !== null) { rr(W - 300, 104, 270, 64, 10, 'rgba(11,13,20,.85)', '#8CFF9E', 3); txt('BALIZA: ' + dist + ' m', W - 165, 137, MONO(26), '#8CFF9E'); }
}
// 1 · ESTRUENDO
S[0] = (lt, d) => {
  skyMountain(lt);
  const k = ease((lt - 1.2) / 2.2);
  [[300, 760, '#C94444'], [470, 800, '#3B82C4'], [640, 770, '#4CC38A'], [520, 960, C.yellow]].forEach(([x, y, c], j) => person({...JACKET, shirt: c, sleeve: c, x, y, h: j === 3 ? 160 : 110, look: -1, eyeScale: lt > 1 ? 1.3 : 1, mouth: lt > 1 ? 'o' : 'line'}));
  if (k > 0) { X.fillStyle = 'rgba(232,241,248,.93)'; X.beginPath(); X.moveTo(-50, 380); X.lineTo(1130, 380); X.lineTo(1130, lerp(420, 1000, k)); for (let x = 1130; x >= -50; x -= 70) X.lineTo(x, lerp(420, 1000, k) + Math.sin(x * .03 + lt * 8) * 40); X.fill();
    for (let i = 0; i < 40; i++) circ(rnd(i) * W, lerp(420, 1000, k) + rnd(i + 2) * 60 - 30, 20 + rnd(i) * 40, 'rgba(255,255,255,.85)'); }
  if (lt > 3.4 && lt < 3.7) { X.fillStyle = '#FFF'; X.fillRect(0, 0, W, IL_H); }
  if (lt > 3.7) { X.fillStyle = SNOW; X.fillRect(0, 0, W, IL_H); X.fillStyle = SNOW2; for (let i = 0; i < 6; i++) ell(rnd(i) * W, 300 + rnd(i + 1) * 700, 160, 40, SNOW2);
    person({...JACKET, x: 540, y: 1000, h: 380, look: 0, eyeScale: 1.3, mouth: 'o', blink: blinkAt(lt, 1)}); }
  tag('LADERA NORTE · 15:42', 40, 40);
};
// 2 · 15 MINUTOS
S[1] = (lt, d) => {
  underSnow(lt);
  X.save(); X.translate(560, 700); X.rotate(-.3); person({...JACKET, shirt: '#C94444', sleeve: '#C94444', x: 0, y: 0, h: 300, arms: [2.6, -2.4], mouth: 'line'}); X.restore();
  ell(500, 560, 60, 40, 'rgba(30,50,80,.35)');
  const k = ease(lt / .5); X.save(); X.globalAlpha = k; rr(240, 240, 600, 200, 24, 'rgba(11,13,20,.9)', C.ice, 5); txt('15:00', 540, 345, F(900, 120), C.ice); X.restore();
  tag('BAJO LA NIEVE', 40, 40, C.ice); hudBeacon(1, lt, d);
};
// 3 · PIIP
S[2] = (lt, d) => {
  X.fillStyle = SNOW2; X.fillRect(0, 0, W, IL_H); vignette(.4);
  X.strokeStyle = C.yellow; X.lineWidth = 70; X.lineCap = 'round'; X.beginPath(); X.moveTo(-60, 1100); X.lineTo(330, 820); X.stroke();
  beacon(540, 560, 1.4, 14, {beep: lt * 1.4 % 1, arrow: Math.sin(lt * 2) * .15});
  tag('TU BALIZA', 40, 40, '#8CFF9E'); hudBeacon(2, lt, d);
};
// 4 · REGLA 1
S[3] = (lt, d) => {
  skyMountain(lt);
  X.fillStyle = SNOW; X.fillRect(0, 760, W, IL_H - 760);
  for (let i = 0; i < 6; i++) ell(200 + i * 120 - (lt * 40 % 120), 860, 30, 10, SNOW3);
  person({...JACKET, x: 540, y: 1000, h: 330, look: 1, arms: [0.1, -1.1]});
  ruleCard(1, 'SIGUE LA FLECHA, NO TU OÍDO.', 'Bajo la nieve nadie oye los gritos.', lt, false); tag('LADERA · BÚSQUEDA', 40, 40); hudBeacon(3, lt, d);
};
// 5 · 9 METROS
S[4] = (lt, d) => {
  X.fillStyle = SNOW; X.fillRect(0, 0, W, IL_H);

const META = [

  ['+1 min', 'REGLA 1', 'SIGUE LA FLECHA', C.yellow, 125, 'VIGILANCIA'],

  ['+2 min 30 s', 'REGLA 2', 'LA SONDA', C.yellow, 124, 'VIGILANCIA'],
  ['+5 min', 'CAVANDO', '2 METROS', C.red, 140, 'PELIGRO'],
  ['+5 min 30 s', 'REGLA 3', 'CUENTA TU AIRE', C.red, 148, 'PELIGRO'],
  ['+8 min', 'RESPIRACIÓN', 'MÁS RÁPIDO', C.red, 155, 'PELIGRO'],
  ['+8 min 20 s', 'TU BALIZA', 'EMITIR', C.red, 160, 'AMENAZA'],
  ['+9 min', 'LA VERDAD', 'LA SEÑAL ERES TÚ', C.red, 165, 'AMENAZA'],
  ['+12 min', 'TU AIRE', '3:00', C.ice, 118, 'HIPOTERMIA', C.ice],
  ['+12 min 40 s', 'ARRIBA', '¡ESTÁ AQUÍ!', C.green, 98, 'RESCATE', C.green],
  ['+13 min', 'A SALVO', 'SOBREVIVISTE', C.green, 90, 'CALMA', C.green],

const KEY_Y = ['avalancha', 'quince', 'minutos', 'baliza', 'flecha', 'nueve', 'sonda', 'espiral', 'dos', 'respiraciones', 'aire'];
const KEY_R = ['enterrado', 'techo', 'emitir', 'tuya', 'frío', 'rápido', 'nadie'];
const END_LINES = ['Aprende a usar tu baliza.', 'La señal puede ser la tuya.'];

// ---------- pulso ----------
const DT = 1 / 600, N = Math.ceil((T.duration + 2) / DT);
const phase = new Float64Array(N);
function bpmAt(t) { let i = SC.findIndex(s => t < s.end); if (i < 0) i = SC.length - 1; const prev = i ? META[i - 1][4] : META[0][4]; return lerp(prev, META[i][4], clamp((t - SC[i].start) / 1.2)); }
for (let i = 1; i < N; i++) phase[i] = phase[i - 1] + bpmAt(i * DT) / 60 * DT;

function pulseColor(i) { const m = META[i]; if (m[6]) return m[6]; return m[5] === 'CONTENCIÓN' || m[5] === 'VIGILANCIA' ? C.yellow : m[4] >= 120 ? C.red : C.yellow; }

// ---------- capas fijas ----------
function topBar(t, i, lt) {
  const m = META[i], k = ease(lt / .3);
  X.fillStyle = C.bg; X.fillRect(0, 0, W, IL_Y);
  X.save(); X.globalAlpha = k; txt(m[0], 540, 82, F(900, 76), C.white); X.restore();
  const n = META.length, x0 = 140, x1 = 940; X.strokeStyle = '#2A2E3A'; X.lineWidth = 4; X.beginPath(); X.moveTo(x0, 158); X.lineTo(x1, 158); X.stroke();
  for (let j = 0; j < n; j++) { const x = lerp(x0, x1, j / (n - 1)); const on = j <= i; circ(x, 158, j === i ? 11 : 7, on ? C.yellow : '#3A3F4D'); if (j === i) circ(x, 158, 22 + Math.sin(t * 6) * 3, null, 'rgba(232,185,49,.35)', 3); }
  txt(m[1], 540, 207, MONO(24), '#9AA0AE');
  X.save(); X.globalAlpha = k; X.translate(0, (1 - k) * 18); txt(m[2], 540, 270, F(900, 64), m[3]); X.restore();
}
function pulseBar(t, i) {
  const y0 = IL_Y + IL_H, h = 170; X.fillStyle = C.bg; X.fillRect(0, y0, W, h);
  const col = pulseColor(i), bpm = Math.round(bpmAt(t)), cy = y0 + 72;

  X.stroke(); circ(x1, cy - (bpmAt(t) < 5 ? 0 : ecg(ph(t))) * 62, 9, col);
  const beat = ph(t) % 1, s = beat > .16 && beat < .3 ? 1.18 : 1;
  X.save(); X.translate(865, cy); X.scale(s, s); X.fillStyle = col; X.beginPath(); X.moveTo(0, 14); X.bezierCurveTo(-30, -6, -18, -30, 0, -14); X.bezierCurveTo(18, -30, 30, -6, 0, 14); X.fill(); X.restore();
  txt(bpm < 5 ? '--' : String(bpm), 965, cy + 2, F(900, 58), col);

}
function captions(t, i) {
  const y0 = IL_Y + IL_H + 170; X.fillStyle = C.bg; X.fillRect(0, y0, W, H - y0);
  const ws = WORDS.filter(w => w.sc === i); if (!ws.length) { if (i === 13 && t > SC[13].start + 1.6) { const k = ease((t - SC[13].start - 1.6) / .4); X.globalAlpha = k; txt(END_LINES[0], 540, y0 + 95, F(900, 56), C.white); txt(END_LINES[1], 540, y0 + 172, F(900, 56), C.yellow); X.globalAlpha = 1; } return; }

  ws.forEach((w, j) => { g.push(w); const end = /[.?:!…"]$/.test(w.w) || g.length >= 5; if (end || j === ws.length - 1) { groups.push(g); g = []; } });
  let cur = groups.find((gr, j) => t < (groups[j + 1] ? groups[j + 1][0].s : 1e9));
  if (!cur || t < cur[0].s - .15) return;
  X.font = F(900, 66); const shown = cur;
  const clean = w => w.replace(/["“”]/g, '');

  parts.forEach((p, j) => { const ww = X.measureText(p + ' ').width; if (lw + ww > 920 && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push(j); lw += ww; });
  lines.forEach((ln, li) => {
    const full = ln.map(j => parts[j]).join(' '); let x = 540 - X.measureText(full).width / 2;
    ln.forEach(j => { const p = parts[j], key = p.toLowerCase().replace(/[¿?¡!.,:"]/g, ''); const w = shown[j];
      const said = t >= w.s - .05, col = !said ? '#3A3F4D' : KEY_R.includes(key) ? C.red : KEY_Y.includes(key) ? C.yellow : C.white; const pop = said ? ease((t - w.s) / .12) : 0;
      X.save(); X.translate(0, -pop * 0); X.scale(1, 1); txt(p, x, y0 + 110 + (li - (lines.length - 1) / 2) * 80, F(900, 66), col, 'left'); X.restore();
      x += X.measureText(p + ' ').width; });
  });
}
function hud(t, i) {}
function rulesHud(t, i) {}
let grain;
function makeGrain() { grain = document.createElement('canvas'); grain.width = 512; grain.height = 512; const g = grain.getContext('2d'), im = g.createImageData(512, 512); for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 14; } g.putImageData(im, 0, 0); }
makeGrain();

function render(t) {
  performanceT = t;
  let i = SC.findIndex(s => t < s.end); if (i < 0) i = SC.length - 1;
  const lt = t - SC[i].start, d = SC[i].end - SC[i].start;
  X.fillStyle = C.bg; X.fillRect(0, 0, W, H);
  // ilustración con zoom lento
  X.save(); X.beginPath(); X.rect(0, IL_Y, W, IL_H); X.clip(); X.translate(0, IL_Y);
  const z = 1 + .05 * clamp(lt / d), shake = (i === 7 && lt < .7) ? Math.sin(t * 70) * 8 : 0;
  X.translate(W / 2 + shake, IL_H / 2); X.scale(z, z); X.translate(-W / 2, -IL_H / 2);
  S[i](lt, d);
  X.restore();
  X.save(); X.translate(0, IL_Y); X.beginPath(); X.rect(0, 0, W, IL_H); X.clip(); X.globalAlpha = 1; X.drawImage(grain, (t * 997) % 400 - 400, (t * 613) % 400 - 400, 1600, 1600); X.restore();
  hud(t, i); rulesHud(t, i);
  // transición: barrido rápido
  if (i > 0 && lt < .22) { const k = lt / .22; X.fillStyle = '#000'; X.fillRect(0, IL_Y, W * (1 - easeIO(k)), IL_H); }
  if (i === 8 && lt < .5) { X.fillStyle = '#000'; X.fillRect(0, IL_Y, W, IL_H); }
  topBar(t, i, lt); pulseBar(t, i); captions(t, i);
  X.strokeStyle = '#151824'; X.lineWidth = 2; X.beginPath(); X.moveTo(0, IL_Y); X.lineTo(W, IL_Y); X.moveTo(0, IL_Y + IL_H); X.lineTo(W, IL_Y + IL_H); X.stroke();
  // final a negro
  const end = T.duration - .8; if (t > end) { X.fillStyle = `rgba(0,0,0,${clamp((t - end) / .8)})`; X.fillRect(0, 0, W, H); }
}
window.render = render; window.DURATION = T.duration;
window.frame = (t) => { render(t); return cv.toDataURL('image/jpeg', 0.92); };
if (!navigator.webdriver) { const t0 = performance.now(); (function loop() { render(((performance.now() - t0) / 1000) % T.duration); requestAnimationFrame(loop); })(); }
