<!doctype html><html><head><meta charset="utf-8"><title>Fotos de perfil</title></head><body style="margin:0;background:#000">
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const X = document.getElementById('c').getContext('2d'), W = 1080;
const C = {bg:'#0B0D14', y:'#E8B931', r:'#E04848', w:'#F5F5F5', ice:'#6EC6FF'};
function ecg(x0, x1, y, amp, col, lw) { X.strokeStyle = col; X.lineWidth = lw; X.lineJoin = 'round'; X.beginPath(); X.moveTo(x0, y);
  const m = (x0 + x1) / 2; X.lineTo(m - 120, y); X.lineTo(m - 90, y - amp * .2); X.lineTo(m - 60, y); X.lineTo(m - 30, y + amp * .3); X.lineTo(m, y - amp); X.lineTo(m + 30, y + amp * .5); X.lineTo(m + 60, y); X.lineTo(m + 110, y - amp * .25); X.lineTo(m + 150, y); X.lineTo(x1, y); X.stroke(); }
function bg() { X.fillStyle = C.bg; X.fillRect(0, 0, W, W); const g = X.createRadialGradient(540, 540, 100, 540, 540, 760); g.addColorStop(0, 'rgba(232,72,72,.18)'); g.addColorStop(1, 'rgba(0,0,0,0)'); X.fillStyle = g; X.fillRect(0, 0, W, W); }
const V = {
  a() { bg(); X.beginPath(); X.arc(540, 540, 420, 0, Math.PI * 2); X.strokeStyle = C.y; X.lineWidth = 26; X.stroke();
    X.font = '900 640px Inter'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = C.w; X.fillText('3', 540, 590);
    ecg(150, 930, 560, 260, C.r, 30); },
  b() { bg(); X.beginPath(); X.roundRect(150, 250, 780, 580, 40); X.fillStyle = 'rgba(20,22,32,.95)'; X.fill(); X.strokeStyle = C.y; X.lineWidth = 22; X.stroke();
    X.font = '700 96px "JetBrains Mono", monospace'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = C.y; X.fillText('REGLA', 540, 390);
    X.font = '900 330px Inter'; X.fillStyle = C.w; X.fillText('3', 540, 640); ecg(150, 930, 870, 120, C.r, 22); },
  c() { X.fillStyle = '#050608'; X.fillRect(0, 0, W, W); X.save(); X.beginPath(); X.arc(540, 540, 430, 0, Math.PI * 2); X.clip();
    const g = X.createRadialGradient(540, 380, 40, 540, 540, 430); g.addColorStop(0, '#4A3A20'); g.addColorStop(1, '#141018'); X.fillStyle = g; X.fillRect(0, 0, W, W);
    X.fillStyle = '#E6D3C3'; X.beginPath(); X.arc(540, 620, 330, 0, Math.PI * 2); X.fill(); X.fillStyle = '#101010'; X.beginPath(); X.arc(540, 610, 345, Math.PI * 1.05, Math.PI * 1.95); X.fill();
    for (const s of [-1, 1]) { X.fillStyle = '#FFF'; X.beginPath(); X.arc(540 + s * 120, 590, 82, 0, Math.PI * 2); X.fill(); X.fillStyle = '#111'; X.beginPath(); X.arc(540 + s * 120, 596, 26, 0, Math.PI * 2); X.fill(); }
    X.fillStyle = '#3A1712'; X.beginPath(); X.arc(540, 700, 170, .12 * Math.PI, .88 * Math.PI); X.fill(); X.fillStyle = '#FFF'; X.fillRect(400, 720, 280, 36);
    const v = X.createRadialGradient(540, 540, 240, 540, 540, 430); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.92)'); X.fillStyle = v; X.fillRect(0, 0, W, W); X.restore();
    X.beginPath(); X.arc(540, 540, 430, 0, Math.PI * 2); X.strokeStyle = C.y; X.lineWidth = 26; X.stroke(); }
};
window.draw = k => { V[k](); return document.getElementById('c').toDataURL('image/png'); };
</script></body></html>
